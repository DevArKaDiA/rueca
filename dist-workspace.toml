[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Dependabot may bump actions in the generated release.yml; don't fail on it.
allow-dirty = ["ci"]
# Releases are dispatched by release-plz after it tags (see release-plz.yml).
dispatch-releases = true

# GitHub no longer runs macos-14 (cargo-dist 0.33's default for Apple Silicon):
# the v0.2.0-alpha.1 build was cancelled with "The configuration
# 'macos-14-arm64-us-default' is not supported".
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
