[package]
name = "telar-segment"
description = "Immutable segment format, content packs and local store for Telar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
telar-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tantivy = { version = "0.27.0", default-features = false, features = ["mmap"] }
stable_deref_trait = "1.2.1"
memmap2 = "0.9.12"
bytemuck = { version = "1.25.2", features = ["derive"] }
zstd = "0.14.3"
roaring = "0.11.5"
regex = "1.13.1"
regex-syntax = "0.8.11"
globset = "0.4.20"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
blake3 = "1.8.7"
tempfile = "3.27.0"
fastrand = "2.5.0"
