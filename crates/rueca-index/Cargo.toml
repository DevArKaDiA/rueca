[package]
name = "rueca-index"
description = "Indexing pipeline for Rueca: walk, extract, resolve, write"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rueca-extract.workspace = true
rueca-model.workspace = true
rueca-resolve.workspace = true
rueca-segment.workspace = true
rueca-lang-python.workspace = true
rueca-lang-typescript.workspace = true
rueca-lang-markdown.workspace = true
rueca-lang-php.workspace = true
rueca-lang-data.workspace = true
rueca-lang-go.workspace = true
rueca-lang-java.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
ignore = "0.4"
rayon = "1.10"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.3"
tempfile = "3.27.0"
# Git reads only (RFC 0002 §7.1). No network, no status/dirwalk/attributes:
# HEAD tree + config are all the indexer needs.
gix = { version = "0.90", default-features = false, features = ["sha1"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json.workspace = true
