[package]
name = "telar-index"
description = "Indexing pipeline for Telar: walk, extract, resolve, write"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
telar-extract.workspace = true
telar-model.workspace = true
telar-resolve.workspace = true
telar-segment.workspace = true
telar-lang-python.workspace = true
telar-lang-typescript.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
ignore = "0.4"
rayon = "1.10"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.3"
tempfile = "3.27.0"
# Git reads only (RFC 0002 §7.1). No network, no status/dirwalk/attributes:
# HEAD tree + config are all the indexer needs.
gix = { version = "0.90", default-features = false, features = ["sha1"] }

[dev-dependencies]
tempfile = "3.27.0"
