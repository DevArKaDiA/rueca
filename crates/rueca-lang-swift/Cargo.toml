[package]
name = "rueca-lang-swift"
description = "Swift language pack for Rueca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rueca-extract.workspace = true
rueca-model.workspace = true
tree-sitter.workspace = true
# alex-pinkus/tree-sitter-swift (the grammar nvim-treesitter uses); ships
# its generated parser and depends only on tree-sitter-language ^0.1.
tree-sitter-swift = "0.7.4"

[dev-dependencies]
# Path-only so `cargo publish` drops it (it would form a publish cycle).
rueca-resolve = { path = "../rueca-resolve" }
