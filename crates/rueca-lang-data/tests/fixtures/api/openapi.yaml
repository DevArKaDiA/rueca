openapi: 3.0.3
info:
  title: Shop API
  version: "1.0"
paths:
  /users/{id}:
    get:
      operationId: getUser
      summary: Fetch one user.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          $ref: './common.yaml#/components/responses/NotFound'
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      description: A shop customer.
      type: object
      properties:
        id:
          type: string
        email:
          type: string
