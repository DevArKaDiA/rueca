[package]
name = "telar-mcp"
description = "MCP server for Telar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
telar-query.workspace = true
telar-index.workspace = true
telar-extract.workspace = true
telar-segment.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "time"] }
