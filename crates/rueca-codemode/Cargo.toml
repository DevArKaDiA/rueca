[package]
name = "rueca-codemode"
description = "Code mode for Rueca (RFC 0009, experimental): sandboxed script engines behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["js"]
# JavaScript through QuickJS (`rquickjs`).
js = ["dep:rquickjs"]
# Starlark (`starlark-rust`). Off by default: `starlark` 0.14.3 depends on
# crates with "unmaintained" RUSTSEC advisories (`derivative`, `paste`,
# `fxhash`) that `cargo deny` rejects, and no advisory is ignored (RFC 0009
# §13).
starlark = ["dep:starlark", "dep:allocative"]

[[example]]
name = "phase0"
required-features = ["js", "starlark"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
rquickjs = { version = "0.14.0", optional = true }
starlark = { version = "0.14.3", optional = true }
# The derive `starlark` values need (`Allocative`); the version `starlark` uses.
allocative = { version = "0.3.7", optional = true }

[target.'cfg(unix)'.dev-dependencies]
# `getrusage` for the peak memory of the phase 0 limit probes.
libc = "0.2.177"
