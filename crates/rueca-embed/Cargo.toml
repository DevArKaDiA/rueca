[package]
name = "rueca-embed"
description = "Embedding runtime for Rueca: model presets, sha256-pinned weights cache, the Embedder trait and a llama.cpp backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["embeddings"]
# The llama.cpp backend (vendored C++, needs CMake and a C/C++ compiler) and
# the weights download. Metal is enabled by `llama-cpp-2` itself on Apple
# silicon. Without it the crate keeps presets, keys and the cache listing.
# Nothing is downloaded or embedded unless asked (`rueca models pull`,
# `rueca embed`).
embeddings = ["dep:llama-cpp-2", "dep:ureq", "dep:rustls", "dep:num_cpus", "dep:libc"]
# CUDA build of llama.cpp (service builds, RFC 0007 §4.3).
cuda = ["embeddings", "llama-cpp-2/cuda"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3 = "1.8.7"
sha2 = "0.11.1"
toml = "1.1.8"
# Pinned exactly: the crate does not follow semver meaningfully (RFC 0007 §4.3).
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
num_cpus = { version = "1.17.0", optional = true }
# TLS through rustls + ring with the operating system's trust store
# (rustls-platform-verifier), so no bundled root list (webpki-roots is
# CDLA-Permissive-2.0, outside deny.toml).
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `sysctlbyname` for the performance-core count (threads default).
libc = { version = "0.2.177", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
