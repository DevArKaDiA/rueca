[package]
name = "rueca-mcp"
description = "MCP server for Rueca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rueca-query.workspace = true
rueca-index.workspace = true
rueca-extract.workspace = true
rueca-segment.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "time"] }
