[package]
name = "rueca-lang-markdown"
description = "Markdown language pack for Rueca: heading sections and file links"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rueca-extract.workspace = true
rueca-model.workspace = true
# Pure-Rust CommonMark parser with an offset iterator (RFC 0002 §3.3).
# No default features: the `html` renderer and the CLI's `getopts` are unused.
pulldown-cmark = { version = "0.13.5", default-features = false }
percent-encoding = "2.3"
