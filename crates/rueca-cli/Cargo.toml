[package]
name = "rueca"
description = "Code intelligence for coding agents: index a repository and query its symbols and call graph over MCP"
readme = "../../README.md"
keywords = ["mcp", "code-intelligence", "tree-sitter", "call-graph", "agents"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rueca"
path = "src/main.rs"

[dependencies]
rueca-embed.workspace = true
rueca-index.workspace = true
rueca-query.workspace = true
rueca-mcp.workspace = true
rueca-segment.workspace = true
rueca-extract.workspace = true
rueca-service.workspace = true
rueca-serve = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["service", "embeddings"]
# `rueca serve` (RFC 0008): MCP over HTTP from a service store. Off, the
# binary has no HTTP stack (axum, tokio).
service = ["dep:rueca-serve"]
# Embedding runtime (llama.cpp, built from source: needs CMake and a C/C++
# compiler) and model downloads for `rueca models` / `rueca embed`. It only
# runs when one of those commands is used; without it the binary is lexical
# only and those commands explain how to get it.
embeddings = ["rueca-embed/embeddings"]
# CUDA build of the embedding runtime (service builds).
cuda = ["rueca-embed/cuda"]
# Starlark scripts in the experimental code mode (RFC 0009). Off by default:
# `starlark` depends on crates with "unmaintained" RUSTSEC advisories that
# the repository's `cargo deny` policy rejects. JavaScript is always built.
code-mode-starlark = ["rueca-mcp/code-mode-starlark"]

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json.workspace = true
