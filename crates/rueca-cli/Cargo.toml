[package]
name = "rueca"
description = "Code intelligence for coding agents: index a repository and query its symbols and call graph over MCP"
readme = "../../README.md"
keywords = ["mcp", "code-intelligence", "tree-sitter", "call-graph", "agents"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rueca"
path = "src/main.rs"

[dependencies]
rueca-index.workspace = true
rueca-query.workspace = true
rueca-mcp.workspace = true
rueca-segment.workspace = true
rueca-extract.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json.workspace = true
