[package]
name = "rueca-lang-rust"
description = "Rust language pack for Rueca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rueca-extract.workspace = true
rueca-model.workspace = true
tree-sitter.workspace = true
tree-sitter-rust = "0.24"
# Cargo manifests (the data pack's TOML parser; default features keep the
# recursion guard).
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
