name: Release-plz

# 1. On every push to main, opens/updates the release PR (version bump +
#    CHANGELOG from Conventional Commits).
# 2. When the release PR is merged, publishes every crate to crates.io, tags
#    `vX.Y.Z` and dispatches the cargo-dist release workflow, which builds the
#    binaries and creates the GitHub release. (Tags pushed with GITHUB_TOKEN do
#    not trigger workflows; workflow_dispatch does.) Nothing is published
#    unless the SonarQube quality gate passes on the pushed commit.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Release gate: the SonarQube quality gate on the commit being released.
  sonarqube:
    name: SonarQube
    if: github.repository_owner == 'DevArKaDiA' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/sonarqube.yml
    permissions:
      contents: read

  release:
    name: Release-plz release
    needs: sonarqube
    # Publishing is off until the repository variable RELEASE_ENABLED is set
    # to "true" (Settings → Secrets and variables → Actions → Variables).
    if: github.repository_owner == 'DevArKaDiA' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  dist:
    name: Dispatch binary release
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          tag="$(jq -r '.[] | select(.package_name == "rueca") | .tag' <<<"$RELEASES")"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::release-plz released but did not tag the rueca package"
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f tag="$tag"
          echo "Dispatched release.yml for $tag" >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Release-plz PR
    if: github.repository_owner == 'DevArKaDiA'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
