version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by cargo-dist; update it with `dist init`.
      - dependency-name: "axodotdev/*"
  - package-ecosystem: uv
    directory: /bench
    schedule:
      interval: monthly
