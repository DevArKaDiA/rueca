version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by cargo-dist; update it with `dist init`.
      - dependency-name: "axodotdev/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The builder is the MSRV (rust-version = "1.90"); only its digest moves.
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: uv
    directory: /bench
    schedule:
      interval: monthly
