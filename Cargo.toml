[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/telar-dev/telar"
rust-version = "1.90"

[workspace.dependencies]
telar-model = { path = "crates/telar-model" }
telar-extract = { path = "crates/telar-extract" }
telar-lang-python = { path = "crates/telar-lang-python" }
telar-lang-typescript = { path = "crates/telar-lang-typescript" }
telar-resolve = { path = "crates/telar-resolve" }
telar-segment = { path = "crates/telar-segment" }
telar-index = { path = "crates/telar-index" }
telar-query = { path = "crates/telar-query" }
telar-mcp = { path = "crates/telar-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tree-sitter = "0.27"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = 1
