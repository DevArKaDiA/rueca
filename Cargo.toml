[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/DevArKaDiA/rueca"
homepage = "https://github.com/DevArKaDiA/rueca"
authors = ["Juan F Rojas"]
rust-version = "1.90"

[workspace.dependencies]
rueca-model = { path = "crates/rueca-model", version = "0.1.0-alpha.1" }
rueca-extract = { path = "crates/rueca-extract", version = "0.1.0-alpha.1" }
rueca-lang-python = { path = "crates/rueca-lang-python", version = "0.1.0-alpha.1" }
rueca-lang-typescript = { path = "crates/rueca-lang-typescript", version = "0.1.0-alpha.1" }
rueca-lang-markdown = { path = "crates/rueca-lang-markdown", version = "0.1.0-alpha.1" }
rueca-lang-php = { path = "crates/rueca-lang-php", version = "0.1.0-alpha.1" }
rueca-resolve = { path = "crates/rueca-resolve", version = "0.1.0-alpha.1" }
rueca-segment = { path = "crates/rueca-segment", version = "0.1.0-alpha.1" }
rueca-index = { path = "crates/rueca-index", version = "0.1.0-alpha.1" }
rueca-query = { path = "crates/rueca-query", version = "0.1.0-alpha.1" }
rueca-mcp = { path = "crates/rueca-mcp", version = "0.1.0-alpha.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tree-sitter = "0.27"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
