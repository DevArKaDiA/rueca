[project]
name = "rueca-bench"
version = "0.1.0"
description = "Benchmark harness for Rueca (localization + structural questions, per language) against grep/BM25 and codebase-memory-mcp."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-php>=0.25.1,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "pyyaml>=6.0.3,<7",
    "python-hcl2>=8.1.4,<9",
    "tomli-w>=1.0",
    "numpy>=2.0,<3",
    "tiktoken>=0.12,<0.13",
]

[project.scripts]
rueca-bench = "rueca_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rueca_bench"]

[tool.uv]
# Rebuild the (non-)editable install when sources change; needed with
# UV_NO_EDITABLE=1 (see bench/README.md, macOS hidden-.pth note).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
