[project]
name = "rueca-bench"
version = "0.1.0"
description = "Benchmark harness for Rueca (localization + structural questions, per language) against grep/BM25 and codebase-memory-mcp."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=17",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-php>=0.25.1,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-bash>=0.25.1,<0.26",
    "tree-sitter-zsh==0.64.3",
    "tree-sitter-c-sharp>=0.24.0,<0.25",
    "tree-sitter-kotlin==0.4.0",
    "tree-sitter-ruby>=0.23.1,<0.24",
    "sqlglot==30.35.0",
    "tree-sitter-swift==0.7.4",
    "pyyaml>=6.0.3,<7",
    "python-hcl2>=8.1.4,<9",
    "tomli-w>=1.0",
    "numpy>=2.0,<3",
    "tiktoken>=0.12,<0.13",
]

[project.scripts]
rueca-bench = "rueca_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rueca_bench"]

[tool.uv]
# Rebuild the (non-)editable install when sources change; needed with
# UV_NO_EDITABLE=1 (see bench/README.md, macOS hidden-.pth note).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.uv.sources]
# Kotlin: fwcd/tree-sitter-kotlin as released on crates.io by ast-grep
# (tree-sitter-kotlin-sg 0.4.1, the Rust pack's grammar); PyPI's
# `tree-sitter-kotlin` is another grammar (tree-sitter-grammars), so the
# binding is built from the pinned commit.
tree-sitter-kotlin = { git = "https://github.com/ast-grep/tree-sitter-kotlin", rev = "1a6f9b1ee1125a7357493eeb95da48d16ac302b4" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
