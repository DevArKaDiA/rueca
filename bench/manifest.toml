# PHP S3 gold (RFC 0002 §4.2: scip-php is not viable). PHPStan runs from its
# release PHAR inside the official PHP CLI image (pinned by digest), with the
# bench's own collector extension (bench/phpstan/). Nothing PHP is installed
# on the host; no adopter dependencies are installed (no `composer install`).
[tools.phpstan]
name = "phpstan"
version = "2.3.2"
license = "MIT"
url = "https://github.com/phpstan/phpstan/releases/download/2.3.2/phpstan.phar"
sha256 = "0ded687c44b1f9d0346f7f00fa505212b018efe532b2b18e3a72f6e16feb32be"

[tools.php_image]
name = "php:8.3-cli (Docker official image)"
image = "php@sha256:98d555ff97b3865140ad31032508c3ca089fa97a8944b14ca9dc03ea05d788cd"
license = "PHP-3.01 (run as a separate process; nothing vendored)"

[tools.rueca]
name = "rueca"
binary = "$RUECA_BIN (e.g. target/release/rueca after `cargo build --release -p rueca`)"
contract = "docs/tools.md (alpha)"

