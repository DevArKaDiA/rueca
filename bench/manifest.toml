# rueca-bench manifest (RFC 0001 §15, RFC 0002 §8).
#
# Only identifiers live here: dataset revisions, instance ids, repository
# commits, tool versions and sha256 pins. Dataset content and repository code
# are fetched at runtime into bench/.cache and never committed.

[bench]
schema = 2
alpha_languages = ["python", "typescript", "javascript"]

# ---------------------------------------------------------------- languages
# Adding a language is data (bench/README.md, "Adding a language"). A family
# is one Rueca language pack and one report column; `members` are the
# instance languages it covers. `test_files` patterns (matched against the
# file name) are pooled into one test-path heuristic used for gold and arms.

[languages.python]
label = "python"
members = ["python"]
extensions = [".py", ".pyi"]
test_files = ['^test_.*\.py$', '.*_test\.py$', '^conftest\.py$']
s1_sources = "SWE-bench Verified + Lite (LocAgent function labels, ContextBench context gold)"
s3_gold = "scip-python 0.6.8 (requests, flask) and the PyCG micro-benchmark"

[languages.ecma]
label = "ts/js"
members = ["typescript", "javascript"]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"]
exclude_suffixes = [".d.ts"]
test_files = ['.*\.(test|spec)\.[cm]?[jt]sx?$', '.*-test\.[cm]?[jt]s$']
s1_sources = "SWE-PolyBench (modified_nodes function labels) + SWE-bench Multilingual"
s3_gold = "scip-typescript 0.5.2 (hono, express)"

[languages.php]
label = "php"
members = ["php"]
extensions = [".php"]
test_files = ['.*Test\.php$']
s1_sources = "SWE-bench Multilingual (all four PHP repositories) + SWE-rebench V2 (three small libraries, LLM screen code A); function gold from the tree-sitter labeler (no assembled PHP function labels exist)"
s3_gold = "PHPStan 2.3.2 + rueca-bench collector (monolog 3.9.0, commonmark 2.8.3; no viable SCIP indexer for PHP) and the rueca-bench PHP micro-benchmark (60 hand-labelled snippets)"
notes = "PHPStan gold follows declared and phpdoc types without vendor code; interface-typed receivers resolve to the interface method (no expansion to implementations)."

# Tree-sitter grammars of the bench labeler (S1 function gold, grep arm, S3
# callables). `binding` = Python package (pinned in pyproject.toml) and
# function returning the language. `labeler = "nesting"` (default) is the
# data-driven labeler (treesitter.py: _nesting_functions); `ecma` is the
# code-backed labeler for JS/TS function shapes.

[grammars.python]
binding = "tree_sitter_python:language"
extensions = [".py", ".pyi"]
callables = { function_definition = "Function" }
containers = ["class_definition"]
separator = "."
wrappers = ["decorated_definition"]

[grammars.typescript]
binding = "tree_sitter_typescript:language_typescript"
extensions = [".ts", ".mts", ".cts"]
labeler = "ecma"

[grammars.tsx]
binding = "tree_sitter_typescript:language_tsx"
extensions = [".tsx"]
labeler = "ecma"

[grammars.javascript]
binding = "tree_sitter_javascript:language"
extensions = [".js", ".jsx", ".mjs", ".cjs"]
labeler = "ecma"

[grammars.php]
binding = "tree_sitter_php:language_php"
package = "tree-sitter-php 0.25.1 (MIT)"
extensions = [".php"]
callables = { function_definition = "Function", method_declaration = "Method" }
containers = ["class_declaration", "interface_declaration", "trait_declaration", "enum_declaration"]
separator = "::"
flat_functions = ["function_definition"]

