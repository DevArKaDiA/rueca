# rueca-bench manifest (RFC 0001 §15, RFC 0002 §8).
#
# Only identifiers live here: dataset revisions, instance ids, repository
# commits, tool versions and sha256 pins. Dataset content and repository code
# are fetched at runtime into bench/.cache and never committed.

[bench]
schema = 3
alpha_languages = ["python", "typescript", "javascript"]
# Families pooled in the report's `overall` column of the detailed tables
# (the alpha headline). The scorecard is per language.
overall = ["python", "ecma", "php"]

# ---------------------------------------------------------------- scorecard
# RFC 0004 §6 (floors and targets), §7.2 (minimum populations), §7.6
# (intervals). Values are fractions (latency in milliseconds). Every metric
# has a `floor` (the `stable` bar; `bm25` = the paired bootstrap of
# Rueca − BM25 must not lie entirely below zero, §6.1; absent = reported
# only) and a `target` (`cbm_ratio` = at most that fraction of cbm's value).
# `better = "lower"` for rates and costs. `gated = false` rows are shown in
# the scorecard but never decide a status (confidence-filtered rows, §5).
# The report renders one scorecard per language from this table; nothing
# about floors lives in code.
[scorecard]
min_structural_questions = 300  # per direction and language (§7.2)
min_localization_instances = 30  # per language (§7.2; ≥ 40 where datasets allow)
bootstrap_resamples = 10000
bootstrap_seed = 20261025
min_confidence = 0.6  # second structural row: edges at confidence >= 0.6 (§5)
localization_variant = "kw"  # S1 query variant the scorecard uses (keywords from the issue)

[[scorecard.metrics]]
key = "file_acc@5"
family = "Localization"
label = "File Acc@5"
floor = "bm25"
target = 0.80

[[scorecard.metrics]]
key = "func_acc@10"
family = "Localization"
label = "Function Acc@10"
floor = "bm25"
target = 0.65

[[scorecard.metrics]]
key = "callers_precision"
family = "Structure"
label = "Callers precision"
floor = 0.90
target = 0.97

[[scorecard.metrics]]
key = "callees_precision"
family = "Structure"
label = "Callees precision"
floor = 0.90
target = 0.97

[[scorecard.metrics]]
key = "callers_recall"
family = "Structure"
label = "Callers recall"
floor = 0.75
target = 0.90

[[scorecard.metrics]]
key = "callees_recall"
family = "Structure"
label = "Callees recall"
floor = 0.75
target = 0.90

[[scorecard.metrics]]
key = "callers_precision@conf"
family = "Structure"
label = "Callers precision, confidence ≥ 0.6"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callees_precision@conf"
family = "Structure"
label = "Callees precision, confidence ≥ 0.6"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callers_recall@conf"
family = "Structure"
label = "Callers recall, confidence ≥ 0.6"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "callees_recall@conf"
family = "Structure"
label = "Callees recall, confidence ≥ 0.6"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "definition_found"
family = "Structure"
label = "Definition found"
floor = 0.95
target = 1.0

[[scorecard.metrics]]
key = "micro_callee_f1"
family = "Micro"
label = "Micro-benchmark callee F1"
floor = 0.90
target = 0.98

[[scorecard.metrics]]
key = "parse_error_rate"
family = "Health"
label = "Files with parse errors"
floor = 0.02
target = 0.005
better = "lower"

[[scorecard.metrics]]
key = "latency_p95_ms"
family = "Health"
label = "Query latency p95 (ms)"
floor = 100
target = 20
better = "lower"
unit = "ms"

[[scorecard.metrics]]
key = "tokens_per_answer"
family = "Efficiency"
label = "Tokens per answer (trace, median)"
target = { cbm_ratio = 0.5 }
better = "lower"
unit = "tokens"

[[scorecard.metrics]]
key = "tokens_per_search"
family = "Efficiency"
label = "Tokens per answer (search, median)"
target = { cbm_ratio = 0.5 }
better = "lower"
unit = "tokens"

# Configuration (RFC 0003 §3.3): one scorecard for the data formats.
[[scorecard.config_metrics]]
key = "key_recall"
label = "Key recall"
floor = 0.95
target = 1.0

[[scorecard.config_metrics]]
key = "span_accuracy"
label = "Span line accuracy"
floor = 0.95
target = 1.0

[[scorecard.config_metrics]]
key = "bridge_precision"
label = "Env bridge precision"
floor = 0.95
target = 0.99

[[scorecard.config_metrics]]
key = "bridge_recall"
label = "Env bridge recall"
floor = 0.75
target = 0.90

# ---------------------------------------------------------------- calibration
# RFC 0004 §7.7: ranking weights and heuristics are tuned only on the
# calibration split — instances and repositories disjoint from the gated
# ones — and the gated set is only evaluated. Entries with
# `split = "calibration"` (`[[s1.repos]]`, `[[s3.repos]]`) are scored in a
# separate section of the report and never enter the scorecard; entries
# with `split = "diagnostic"` are reported and never gated (express, PyCG).

# Clone mode (corpus.py): `shallow` = true makes every new clone an empty
# promisor repository that fetches each pinned commit with
# `--depth=1 --filter=blob:none` (one tree per commit instead of the whole
# history). Existing clones keep their mode.
[corpus]
shallow = true

# ---------------------------------------------------------------- languages
# Adding a language is data (bench/README.md, "Adding a language"). A family
# is one Rueca language pack and one report column; `members` are the
# instance languages it covers. `test_files` patterns (matched against the
# file name) are pooled into one test-path heuristic used for gold and arms.

[languages.python]
label = "python"
members = ["python"]
extensions = [".py", ".pyi"]
test_files = ['^test_.*\.py$', '.*_test\.py$', '^conftest\.py$']
s1_sources = "SWE-bench Verified + Lite (LocAgent function labels, ContextBench context gold)"
s3_gold = "scip-python 0.6.8 (requests, flask, jinja; click = calibration) and the rueca-bench Python micro-benchmark (PyCG = diagnostic)"

[languages.ecma]
label = "ts/js"
members = ["typescript", "javascript"]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"]
exclude_suffixes = [".d.ts"]
test_files = ['.*\.(test|spec)\.[cm]?[jt]sx?$', '.*-test\.[cm]?[jt]s$']
s1_sources = "SWE-PolyBench (modified_nodes function labels) + SWE-bench Multilingual"
s3_gold = "scip-typescript 0.5.2 (hono, zod; express = diagnostic) and the rueca-bench TS/JS micro-benchmark"

[languages.php]
label = "php"
members = ["php"]
extensions = [".php"]
test_files = ['.*Test\.php$']
s1_sources = "SWE-bench Multilingual (all four PHP repositories) + SWE-rebench V2 (three small libraries, LLM screen code A); function gold from the tree-sitter labeler (no assembled PHP function labels exist)"
s3_gold = "PHPStan 2.3.2 + rueca-bench collector (monolog 3.9.0, commonmark 2.8.3; no viable SCIP indexer for PHP) and the rueca-bench PHP micro-benchmark (60 hand-labelled snippets)"
notes = "PHPStan gold follows declared and phpdoc types without vendor code; interface-typed receivers resolve to the interface method (no expansion to implementations)."

[languages.go]
label = "go"
members = ["go"]
extensions = [".go"]
test_files = ['.*_test\.go$']
test_dirs = ["testdata"]
s1_sources = "SWE-bench Multilingual (all 42 Go instances: caddy, gin, prometheus, hugo, terraform); function gold from the tree-sitter labeler"
s3_gold = "scip-go 0.2.9 (gin v1.11.0, urfave/cli v3.9.1; goawk = calibration) and the rueca-bench Go micro-benchmark"
notes = "Go methods are named `Type.method` (receiver type, pointer stripped). scip-go resolves interface calls to the interface method only."

[languages.java]
label = "java"
members = ["java"]
extensions = [".java"]
test_files = ['.*Tests?\.java$', '.*TestCase\.java$', '^Test[A-Z].*\.java$']
s1_sources = "SWE-PolyBench Java (modified_nodes function labels; gson, dubbo, rocketmq, apollo) + SWE-bench Multilingual (gson, lombok)"
s3_gold = "scip-java 0.13.2 via javac in Docker (gson 2.15.0, javapoet 1.13.0) and the rueca-bench Java micro-benchmark"
notes = "scip-java resolves interface calls to the interface method only (no expansion to implementations)."

[languages.c]
label = "c"
members = ["c"]
extensions = [".c", ".h"]
test_files = ['^test_.*\.c$', '.*_test\.c$']
s1_sources = "SWE-bench Multilingual (all 30 C instances: redis, jq, micropython, valkey); function gold from the tree-sitter labeler"
s3_gold = "scip-clang 0.4.1 (cJSON v1.7.19, Lua 5.4.7; bench-synthesized compile_commands.json) and the rueca-bench C micro-benchmark"

[languages.cpp]
label = "cpp"
members = ["cpp"]
extensions = [".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx", ".h"]
test_files = ['.*[_-]test\.(cc|cpp|cxx)$', '^test[_-].*\.(cc|cpp|cxx)$']
s1_sources = "SWE-bench Multilingual (all 12 C++ instances: fmt, nlohmann/json) + Multi-SWE-bench C++ (fmt, nlohmann/json, Catch2, simdjson); function gold from the tree-sitter labeler"
s3_gold = "scip-clang 0.4.1 (fmt 12.1.0, yaml-cpp 0.8.0; bench-synthesized compile_commands.json) and the rueca-bench C++ micro-benchmark"
notes = "`.h` headers belong to the instance language (C or C++); the bench parses them with that grammar."

# Tree-sitter grammars of the bench labeler (S1 function gold, grep arm, S3
# callables). `binding` = Python package (pinned in pyproject.toml) and
# function returning the language. `labeler = "nesting"` (default) is the
# data-driven labeler (treesitter.py: _nesting_functions); `ecma` is the
# code-backed labeler for JS/TS function shapes.

[grammars.python]
binding = "tree_sitter_python:language"
extensions = [".py", ".pyi"]
callables = { function_definition = "Function" }
containers = ["class_definition"]
separator = "."
wrappers = ["decorated_definition"]

[grammars.typescript]
binding = "tree_sitter_typescript:language_typescript"
extensions = [".ts", ".mts", ".cts"]
labeler = "ecma"

[grammars.tsx]
binding = "tree_sitter_typescript:language_tsx"
extensions = [".tsx"]
labeler = "ecma"

[grammars.javascript]
binding = "tree_sitter_javascript:language"
extensions = [".js", ".jsx", ".mjs", ".cjs"]
labeler = "ecma"

[grammars.php]
binding = "tree_sitter_php:language_php"
package = "tree-sitter-php 0.25.1 (MIT)"
extensions = [".php"]
callables = { function_definition = "Function", method_declaration = "Method" }
containers = ["class_declaration", "interface_declaration", "trait_declaration", "enum_declaration"]
separator = "::"
flat_functions = ["function_definition"]

# Go: code-backed labeler (method names come from the receiver type).
# `calls` / `members` drive SCIP call-site classification (treesitter.py:
# _is_callee): a reference is a call when it is the `calls[parent]` child of
# its parent, or the `members[parent]` child of a callee.
[grammars.go]
binding = "tree_sitter_go:language"
package = "tree-sitter-go 0.25.0 (MIT)"
extensions = [".go"]
labeler = "go"
separator = "."
calls = { call_expression = "function" }
members = { selector_expression = "field", index_expression = "operand", parenthesized_expression = "@0" }

[grammars.java]
binding = "tree_sitter_java:language"
package = "tree-sitter-java 0.23.5 (MIT)"
extensions = [".java"]
callables = { method_declaration = "Method", constructor_declaration = "Method", compact_constructor_declaration = "Method" }
containers = ["class_declaration", "interface_declaration", "enum_declaration", "record_declaration", "annotation_type_declaration"]
separator = "."
calls = { method_invocation = "name", object_creation_expression = "type", explicit_constructor_invocation = "constructor" }
members = { generic_type = "@0", scoped_type_identifier = "@-1" }

# C and C++ share the code-backed `c` labeler; `.h` goes to the grammar whose
# `languages` lists the instance language (C++ when there is no hint).
[grammars.cpp]
binding = "tree_sitter_cpp:language"
package = "tree-sitter-cpp 0.23.4 (MIT)"
languages = ["cpp"]
extensions = [".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx", ".h"]
labeler = "c"
separator = "::"
calls = { call_expression = "function", new_expression = "type" }
members = { field_expression = "field", qualified_identifier = "name", template_function = "name", template_method = "name", parenthesized_expression = "@0" }

[grammars.c]
binding = "tree_sitter_c:language"
package = "tree-sitter-c 0.24.2 (MIT)"
languages = ["c"]
extensions = [".c", ".h"]
labeler = "c"
separator = "::"
calls = { call_expression = "function" }
members = { field_expression = "field", parenthesized_expression = "@0" }

