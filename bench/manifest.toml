# ---------------------------------------------------------------- org scenarios
# RFC 0005 §8, RFC 0006 §8 (org.py): a multi-repository organization and one
# repository at two commits (`[multiref] instance`: base commit vs base +
# gold patch).
#
# `[[org.repos]]` are the organization's members, each pinned to one commit.
# Pin rule (deterministic; `org.derive_pins` recomputes it and a unit test
# checks this list against it): every gated S1 repository at the
# `base_commit` of its first gated `[[s1.instances]]` entry (manifest order),
# then every calibration S1 repository at the `base_commit` of its first
# calibration entry. `split = "gated"` members form the gated organization;
# the calibration organization is the gated one plus the `split =
# "calibration"` members (RFC 0004 §7.7: tuning happens there only).
# Instances: per member, its S1 instances in manifest order whose S1 gold is
# present at the pin (every gold file exists there and, when the instance has
# function gold, at least one gold function exists by qualified name) and
# whose fix is not already at the pin (`patch_at_pin` != "reverse"), the
# first `max_instances_per_repo` of them (`calibration_max_instances_per_repo`
# for the calibration split: it is only tuned on, so it may be larger).
#
# A member without S1 instances (a sibling library: pallets/jinja,
# pallets/werkzeug, tokio-rs/mio, hyperium/hyper, tower-rs/tower, ...) is
# simply indexed with the others (a distractor, and a dependency target for
# the link layer); give it `split = "gated"` to have it in both
# organizations and `pin` saying where its commit comes from.
[org]
# S1 languages whose repositories are not members yet: the organization
# numbers above were measured without them, so they join (and the pin rule
# covers them) at the next full run of the organization scenario, which
# re-measures every arm. C#, Kotlin, Ruby and Swift were added after the last
# run, and so were the mined shell and SQL instances.
pending_languages = ["csharp", "kotlin", "ruby", "swift", "shell", "sql"]
max_instances_per_repo = 3
calibration_max_instances_per_repo = 5

