# ---------------------------------------------------------------- S3 structural
# Gold call edges from SCIP indexes (`gold = "scip"`, default) or, for PHP,
# the bench's PHPStan collector (`gold = "phpstan"`) at pinned commits
# (RFC 0002 §4.2). Micro-benchmarks (`[[s3.micro]]`) are hand-written call
# graphs of small programs; every function is a question.

[s3]
sample_per_repo = 50
seed = 20261022
min_lines = 3

[[s3.repos]]
repo = "psf/requests"
language = "python"
tag = "v2.34.2"
commit = "6e83187b8feb273ed4c6cdab5efd8d54901dfab3"
