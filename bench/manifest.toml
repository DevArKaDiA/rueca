# telar-bench manifest (RFC 0001 §15, RFC 0002 §8).
#
# Only identifiers live here: dataset revisions, instance ids, repository
# commits, tool versions and sha256 pins. Dataset content and repository code
# are fetched at runtime into bench/.cache and never committed.

[bench]
schema = 1
alpha_languages = ["python", "typescript", "javascript"]

# ---------------------------------------------------------------- tools

[tools.cbm]
name = "codebase-memory-mcp"
version = "0.12.0"
release = "https://github.com/DeusData/codebase-memory-mcp/releases/tag/v0.12.0"
license = "MIT"
index_mode = "full"  # index_repository default (all passes + semantic)
cli = "codebase-memory-mcp cli --quiet <tool> '<json>'"

[tools.cbm.binaries.darwin-arm64]
url = "https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.12.0/codebase-memory-mcp-darwin-arm64.tar.gz"
archive_sha256 = "1be41a9dd6902e3633eb0b280189117dc3db3be623bdd3dd4c6ea74372b5a50b"
binary_sha256 = "d26ba94b11b79f727923eaadb811e044a52618ae6d303670df5467f1e6c25015"

[tools.cbm.binaries.linux-amd64]
url = "https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.12.0/codebase-memory-mcp-linux-amd64.tar.gz"
archive_sha256 = "2c0a3f3314874e2315ed169165f1fdf74d9628c7f8b301579b900fcc6d7bcd9c"
binary_sha256 = "cedf9a2a1f8f523c62864ce2dfc791bb51b43c97845a1c3a6fe908a8bf64009b"

[tools.scip_python]
npm = "@sourcegraph/scip-python"
version = "0.6.8"
license = "MIT"

[tools.scip_typescript]
npm = "@sourcegraph/scip-typescript"
version = "0.5.2"
license = "Apache-2.0"

[tools.telar]
name = "telar"
binary = "$TELAR_BIN (e.g. target/release/telar after `cargo build --release -p telar-cli`)"
contract = "docs/tools.md (alpha)"

# ---------------------------------------------------------------- datasets
# Fetched from Hugging Face at the pinned revision and verified by sha256.

[datasets.swe_bench_verified]
hf = "princeton-nlp/SWE-bench_Verified"
revision = "c104f840cc67f8b6eec6f759ebc8b2693d585d4a"
file = "data/test-00000-of-00001.parquet"
sha256 = "a45b1fe4e2f0c8390b2b2938ac83e92ed5979000856808f3679c07812e9e6dcd"
card_license = "none stated on the dataset card"
citation = "Jimenez et al., SWE-bench (ICLR 2024); OpenAI, SWE-bench Verified (2024)"

[datasets.swe_bench_lite]
hf = "SWE-bench/SWE-bench_Lite"
revision = "b0dde1093fe417d83b7184254edf8199c1f0dff5"
file = "data/test-00000-of-00001.parquet"
sha256 = "438e281d80587aa7be470896ce410557002fde02d2ceee3e099331d308f62dd3"
card_license = "none stated on the dataset card"
citation = "Jimenez et al., SWE-bench (ICLR 2024)"

[datasets.swe_polybench]
hf = "AmazonScience/SWE-PolyBench"
revision = "d56445f9940eae4e9d2974ec66820c2f1d7754e6"
file = "test.csv"
sha256 = "17ad661b20e9af1e2067fbbc2e2658a21137d56693570d1d07f966d8bc0408b7"
card_license = "MIT"
citation = "Rashid et al., SWE-PolyBench (Amazon Science, 2025)"
gold_column = "modified_nodes"  # assembled function-level gold (CST node paths)

[datasets.swe_bench_multilingual]
hf = "SWE-bench/SWE-bench_Multilingual"
revision = "846e647b9f33c0b51b739d005d13d85493c9af09"
file = "data/test-00000-of-00001.parquet"
sha256 = "92abca7cb527b41a9f66d03a26ce441ff7319e3a49f985998fd56be4bb9b08b2"
card_license = "MIT"
citation = "SWE-bench Multilingual (SWE-bench team, 2025)"

# Assembled localization gold (RFC 0002 §8/§9). Used for gold labels only;
# issue text / patches still come from the source dataset of each instance.

[datasets.locagent_lite]
hf = "czlll/SWE-bench_Lite"
revision = "97f9af8814fe7eb15dcd9b2abaa9010e1eadda63"
file = "data/test-00000-of-00001.parquet"
sha256 = "008ac523001de665d3f1e4f4179587dcd68dd7b2f2d5bd878a5385e3e938b59d"
columns = ["instance_id", "repo", "edit_functions", "added_functions"]
card_license = "none stated on the dataset card; LocAgent code (gersteinlab/LocAgent) is Apache-2.0"
citation = "Chen et al., LocAgent: Graph-Guided LLM Agents for Code Localization (ACL 2025)"
role = "function-level edit gold (`edit_functions`) for SWE-bench Lite instances"

[datasets.contextbench]
hf = "Contextbench/ContextBench"
revision = "c2855792b006af41c67202d33883fb9d46362853"
file = "data/full.parquet"
sha256 = "2f56535bdc73eb8a68bf4ebb49789d8e9cd4f219ea60df6290b85278aee61ca8"
id_column = "original_inst_id"
columns = ["original_inst_id", "repo", "base_commit", "gold_context", "source"]
card_license = "none stated on the dataset card; ContextBench code (EuniAI/ContextBench) is Apache-2.0"
citation = "ContextBench (EuniAI, 2026)"
role = "human-annotated gold context spans (secondary S1 metric: context-file recall)"

# ---------------------------------------------------------------- S1 localization
# Instance selection: candidates are instances of the listed repos whose gold
# patch modifies at least one existing, non-test source file of the language.
# Order = sha256(instance_id) ascending; the first `quota` are taken; earlier
# datasets in `sources` win on duplicate ids. `telar-bench select` regenerates
# the [[s1.instances]] list at the end of this file.

[s1]
kw_max_tokens = 12
result_limit = 100
# Selection priority inside each repo quota: instances with more assembled
# gold (LocAgent edit_functions, SWE-PolyBench modified_nodes, ContextBench
# gold context) first, then sha256(instance_id) ascending.
gold_assets = ["locagent_lite", "contextbench"]

[[s1.repos]]
repo = "psf/requests"
language = "python"
quota = 8
sources = ["swe_bench_verified", "swe_bench_lite"]

[[s1.repos]]
repo = "pallets/flask"
language = "python"
quota = 3
sources = ["swe_bench_verified", "swe_bench_lite"]

[[s1.repos]]
repo = "pylint-dev/pylint"
language = "python"
quota = 8
sources = ["swe_bench_verified", "swe_bench_lite"]

[[s1.repos]]
repo = "pytest-dev/pytest"
language = "python"
quota = 11
sources = ["swe_bench_verified", "swe_bench_lite"]

[[s1.repos]]
repo = "sphinx-doc/sphinx"
language = "python"
quota = 10
sources = ["swe_bench_verified", "swe_bench_lite"]

[[s1.repos]]
repo = "tailwindlabs/tailwindcss"
language = "typescript"
quota = 10
sources = ["swe_polybench"]

[[s1.repos]]
repo = "coder/code-server"
language = "typescript"
quota = 10
sources = ["swe_polybench"]

[[s1.repos]]
repo = "vuejs/core"
language = "typescript"
quota = 5
sources = ["swe_bench_multilingual"]

[[s1.repos]]
repo = "preactjs/preact"
language = "javascript"
quota = 10
sources = ["swe_bench_multilingual"]

[[s1.repos]]
repo = "axios/axios"
language = "javascript"
quota = 6
sources = ["swe_bench_multilingual"]

# ---------------------------------------------------------------- S3 structural
# Gold call edges from SCIP indexes at pinned commits (RFC 0002 §4.2).

[s3]
sample_per_repo = 50
seed = 20261022
min_lines = 3

[[s3.repos]]
repo = "psf/requests"
language = "python"
tag = "v2.34.2"
commit = "6e83187b8feb273ed4c6cdab5efd8d54901dfab3"
include = ["src/requests/"]
indexer = "scip_python"
args = ["index", ".", "--project-name", "requests", "--project-version", "2.34.2"]

[[s3.repos]]
repo = "pallets/flask"
language = "python"
tag = "3.1.3"
commit = "22d924701a6ae2e4cd01e9a15bbaf3946094af65"
include = ["src/flask/"]
indexer = "scip_python"
args = ["index", ".", "--project-name", "flask", "--project-version", "3.1.3"]

[[s3.repos]]
repo = "honojs/hono"
language = "typescript"
tag = "v4.13.13"
commit = "08a023cbfde55b434fb0fb30fae35d42e4bf20aa"
include = ["src/"]
indexer = "scip_typescript"
args = ["index"]

[[s3.repos]]
repo = "expressjs/express"
language = "javascript"
tag = "v5.3.0"
commit = "cf6722bf89a86905281d9160b6482e08166b5ef0"
include = ["lib/", "index.js"]
indexer = "scip_typescript"
args = ["index", "--infer-tsconfig"]

# PyCG micro-benchmark (Apache-2.0): hand-written Python call-graph gold.
[s3.pycg]
