[multiref]
instance = "psf__requests-2317"

# Clone mode (corpus.py): `shallow` = true makes every new clone an empty
# promisor repository that fetches each pinned commit with
# `--depth=1 --filter=blob:none` (one tree per commit instead of the whole
# history). Existing clones keep their mode.
[corpus]
shallow = true

# ---------------------------------------------------------------- languages
# Adding a language is data (bench/README.md, "Adding a language"). A family
# is one Rueca language pack and one report column; `members` are the
# instance languages it covers. `test_files` patterns (matched against the
# file name) are pooled into one test-path heuristic used for gold and arms.

[languages.python]
label = "python"
members = ["python"]
extensions = [".py", ".pyi"]
test_files = ['^test_.*\.py$', '.*_test\.py$', '^conftest\.py$']
s1_sources = "SWE-bench Verified + Lite (LocAgent function labels, ContextBench context gold)"
s3_gold = "scip-python 0.6.8 (requests, flask, jinja; click = calibration) and the rueca-bench Python micro-benchmark (PyCG = diagnostic)"

[languages.ecma]
label = "ts/js"
members = ["typescript", "javascript"]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"]
exclude_suffixes = [".d.ts"]
test_files = ['.*\.(test|spec)\.[cm]?[jt]sx?$', '.*-test\.[cm]?[jt]s$']
s1_sources = "SWE-PolyBench (modified_nodes function labels) + SWE-bench Multilingual"
s3_gold = "scip-typescript 0.5.2 (hono, zod; express = diagnostic) and the rueca-bench TS/JS micro-benchmark"

[languages.php]
label = "php"
members = ["php"]
extensions = [".php"]
test_files = ['.*Test\.php$']
s1_sources = "SWE-bench Multilingual (all four PHP repositories) + SWE-rebench V2 (three small libraries, LLM screen code A); function gold from the tree-sitter labeler (no assembled PHP function labels exist)"
s3_gold = "PHPStan 2.3.2 + rueca-bench collector (monolog 3.9.0, commonmark 2.8.3; no viable SCIP indexer for PHP) and the rueca-bench PHP micro-benchmark (60 hand-labelled snippets)"
notes = "PHPStan gold follows declared and phpdoc types without vendor code; interface-typed receivers resolve to the interface method (no expansion to implementations)."

[languages.go]
label = "go"
members = ["go"]
extensions = [".go"]
test_files = ['.*_test\.go$']
test_dirs = ["testdata"]
s1_sources = "SWE-bench Multilingual (all 42 Go instances: caddy, gin, prometheus, hugo, terraform); function gold from the tree-sitter labeler"
s3_gold = "scip-go 0.2.9 (gin v1.11.0, urfave/cli v3.9.1; goawk = calibration) and the rueca-bench Go micro-benchmark"
notes = "Go methods are named `Type.method` (receiver type, pointer stripped). scip-go resolves interface calls to the interface method only."

[languages.java]
label = "java"
members = ["java"]
extensions = [".java"]
test_files = ['.*Tests?\.java$', '.*TestCase\.java$', '^Test[A-Z].*\.java$']
s1_sources = "SWE-PolyBench Java (modified_nodes function labels; gson, dubbo, rocketmq, apollo) + SWE-bench Multilingual (gson, lombok)"
s3_gold = "scip-java 0.13.2 via javac in Docker (gson 2.15.0, javapoet 1.13.0) and the rueca-bench Java micro-benchmark"
notes = "scip-java resolves interface calls to the interface method only (no expansion to implementations)."

[languages.c]
label = "c"
members = ["c"]
extensions = [".c", ".h"]
test_files = ['^test_.*\.c$', '.*_test\.c$']
s1_sources = "SWE-bench Multilingual (all 30 C instances: redis, jq, micropython, valkey); function gold from the tree-sitter labeler"
s3_gold = "scip-clang 0.4.1 (cJSON v1.7.19, Lua 5.4.7; bench-synthesized compile_commands.json) and the rueca-bench C micro-benchmark"

[languages.cpp]
label = "cpp"
members = ["cpp"]
extensions = [".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx", ".h"]
test_files = ['.*[_-]test\.(cc|cpp|cxx)$', '^test[_-].*\.(cc|cpp|cxx)$']
s1_sources = "SWE-bench Multilingual (all 12 C++ instances: fmt, nlohmann/json) + Multi-SWE-bench C++ (fmt, nlohmann/json, Catch2, simdjson); function gold from the tree-sitter labeler"
s3_gold = "scip-clang 0.4.1 (fmt 12.1.0, yaml-cpp 0.8.0; bench-synthesized compile_commands.json) and the rueca-bench C++ micro-benchmark"
notes = "`.h` headers belong to the instance language (C or C++); the bench parses them with that grammar."

[languages.rust]
label = "rust"
members = ["rust"]
extensions = [".rs"]
# Rust has no test-file suffix convention: integration tests live in `tests/`
# (a built-in test directory) and benchmarks in `benches/`; `tests.rs` /
# `test.rs` / `*_tests.rs` files are test modules. Unit tests inside source
# files (`#[cfg(test)] mod tests`, `#[test]` functions) are dropped by the
# labeler (treesitter.py: _rust_functions), not by the file heuristic.
test_files = ['^tests?\.rs$', '.*_tests?\.rs$']
test_dirs = ["benches"]
s1_sources = "SWE-bench Multilingual (Rust: tokio, bat, axum, ruff, coreutils, nushell, ripgrep); function gold from the tree-sitter labeler"
s3_gold = "rust-analyzer 2026-11-09 `scip` (serde_json v1.0.154, ripgrep 15.2.0; bytes = calibration) and the rueca-bench Rust micro-benchmark"
notes = "Rust methods are named `Type.method` (last path segment of the impl's self type) and trait methods `Trait.method`; items under `#[cfg(test)]` / `#[test]` are test code. rust-analyzer resolves calls on a generic `T: Trait` or `dyn Trait` receiver to the trait method only, and calls in a `macro_rules!` body to nothing."

[languages.shell]
label = "shell"
members = ["shell"]
extensions = [".sh", ".bash", ".zsh", ".ksh", ".bats"]
# bats files are tests; shunit2 / plain test scripts by name (`test_x.sh`,
# `x_test.sh`, shellspec `x_spec.sh`).
test_files = ['.*\.bats$', '^test_.*\.(sh|bash|zsh|ksh)$', '.*_test\.(sh|bash|zsh|ksh)$', '.*_spec\.sh$']
s1_sources = "rueca-bench mined set (no localization dataset has shell instances): merged GitHub pull requests that close an issue, screened by rule, on ohmyzsh, spaceship-prompt, prezto (zsh), bash-it, docker-mailserver, asdf, sdkman-cli (bash), linutil, shellspec (POSIX sh); function gold from the shell labeler"
s3_gold = "rueca-bench shell labeler (code-backed, tree-sitter-bash and tree-sitter-zsh by dialect; nvm v0.41.0, acme.sh v3.1.7, bash-it v3.2.0; bats-core = calibration) and the rueca-bench shell micro-benchmark"
notes = "No compiler-grade call graph exists for shell: the structural gold is the bench's own labeler (shellgold.py), written from bash's run-time name lookup, independent of the pack's path evaluation. Extension-less scripts are outside the bench's file set."

[languages.csharp]
label = "csharp"
members = ["csharp"]
extensions = [".cs"]
# C# test projects are directories named `<Project>.Tests` (and `.Test`,
# `.UnitTests`, …): `test_dir_suffixes` marks every file below them as
# test code; `FooTests.cs` / `FooTest.cs` test classes elsewhere by name.
test_files = ['.*Tests?\.cs$']
test_dir_suffixes = [".Tests", ".Test", ".UnitTests", ".IntegrationTests", ".FunctionalTests", ".Specs", ".Spec"]
s1_sources = "SWE-rebench V2 (C# rows its LLM screen rated A: microsoft/kiota, devlooped/moq and six smaller repositories; SWE-bench Multilingual and Multi-SWE-bench carry no C#); function gold from the tree-sitter labeler"
s3_gold = "scip-dotnet 0.2.16 in its pinned Docker image (serilog 4.4.0, eShopOnWeb; YamlDotNet 18.1.0 = calibration) and the rueca-bench C# micro-benchmark"
notes = "C# methods are named `Type.member` (constructors `Type.Type`, local functions `Type.method.local`), namespaces left out. scip-dotnet resolves interface calls to the interface method only and records `new T(…)` as a reference to the type: the gold maps it to `T`'s constructors (one equivalence class when overloaded); `: base(…)` / `: this(…)` initializers and target-typed `new(…)` have no occurrence in its index."

[languages.kotlin]
label = "kotlin"
members = ["kotlin"]
extensions = [".kt", ".kts"]
# Kotlin Multiplatform source sets name their test directories after the
# target (`commonTest`, `jvmTest`); Android keeps instrumented tests in
# `androidTest`. JVM layouts use `src/test` (a built-in test directory).
test_files = ['.*Tests?\.kts?$', '.*TestCase\.kt$', '^Test[A-Z].*\.kt$']
test_dirs = ["commonTest", "jvmTest", "androidTest", "androidUnitTest"]
s1_sources = "Multi-SWE-bench Kotlin (ktlint, detekt, ORT, TeXiFy-IDEA, Kotlin DataFrame, OkHttp, Shadow; SWE-bench Multilingual carries no Kotlin) + SWE-rebench V2 calibration (kotlin-inject, anvil, mordant; LLM screen code A); function gold from the tree-sitter labeler"
s3_gold = "scip-java 0.14.2 Kotlin Analysis API indexer via a scip-java.json build in Docker (moshi 2.0.0-alpha.1, clikt 5.2.1; kotlinpoet 2.4.0 = calibration)"
notes = "Constructors are named like their class (`Foo.Foo`): the primary one (explicit or implicit) on the class name's line, secondary ones on their first line. Property accessors, lambdas and `init` blocks are not callables. scip-java resolves interface calls to the interface method only."

[languages.ruby]
label = "ruby"
members = ["ruby"]
extensions = [".rb", ".rake", ".gemspec", ".ru"]
# RSpec `*_spec.rb` and Minitest / Test::Unit `*_test.rb` files (and the
# built-in `spec/` and `test/` directories) are test code.
test_files = ['.*_spec\.rb$', '.*_test\.rb$']
s1_sources = "SWE-bench Multilingual (Ruby: rubocop, fluentd, fastlane, jekyll gated; faker, fpm = calibration); function gold from the tree-sitter labeler"
s3_gold = "scip-ruby 0.5.1 (Sorbet; jekyll v4.4.1 untyped, ruby-lsp v0.26.11 typed with RBS comments; rack v3.2.9 and packwerk v3.3.1 = calibration) and the rueca-bench Ruby micro-benchmark"
notes = "Ruby methods are named `Const::Path#method` (instance) and `Const::Path.method` (singleton, `class << self`, `module_function`). scip-ruby (Sorbet) resolves constants, `self` calls through the ancestors and mixins, `Foo.new` (to `initialize`) and receivers typed by a local `x = Foo.new`, a `sig` or an RBS comment; a call on a receiver of unknown type (an untyped parameter, the result of a method without a signature) has no gold edge, so a by-name guess there scores as a false positive."

[languages.sql]
label = "sql"
members = ["sql"]
extensions = [".sql", ".psql", ".pgsql", ".plpgsql", ".mysql", ".tsql", ".bq", ".pks", ".pkb", ".pck", ".pls", ".plsql", ".tps", ".tpb"]
# pgTAP / plain SQL test scripts by name; dbt singular tests live in `tests/`
# (a built-in test directory).
test_files = ['^test_.*\.sql$', '.*_test\.sql$']
# dbt packages keep a test project in `integration_tests/` (models, seeds
# and tests that exercise the package): test code of SQL files only.
own_test_dirs = ["integration_tests"]
s1_sources = "rueca-bench mined set (no localization dataset has SQL instances): merged GitHub pull requests that close an issue, screened by rule, on seven dbt packages (dbt-utils, dbt-project-evaluator, dbt-external-tables, dbt-date, dbt_artifacts, dbt-snowflake-monitoring, tuva-core), First Responder Kit (T-SQL), pgmq and pg_partman (PL/pgSQL), mimic-code and bigquery-utils (BigQuery / analytical SQL); function gold from the SQL labeler with the dialect the manifest gives each tree"
s3_gold = "rueca-bench SQL labeler (code-backed, sqlglot 30.35.0; jOOQ/sakila multi-dialect schemas, fivetran/dbt_hubspot v1.11.0 dbt models, pgmq v1.13.2, tSQLt 4a921d0, mimic-code v3.0.1 PostgreSQL concepts; sqlc examples = calibration) and the rueca-bench SQL micro-benchmark (per dialect)"
notes = "No cross-reference tool exists for SQL repositories: the structural gold is the bench's own labeler (sqlgold.py, sqlglot + dbt Jinja regexes), independent of the pack's parser (sqlparser-rs). Edges are any dependency between definitions (tables, views, routines, triggers, dbt models and macros, named queries): relation references, foreign keys, calls; the Rueca arm traces CALLS, REFERENCES and WRITES (`trace_edges`)."
trace_edges = ["CALLS", "REFERENCES", "WRITES"]
# Tables, views, dbt models and snapshots (`Struct`) are callables of the
# structural questions too (arms/base.py: is_callable_label).
callable_labels = ["Struct"]

[languages.swift]
label = "swift"
members = ["swift"]
extensions = [".swift"]
# SwiftPM test targets live in `Tests/<Target>/` (only Swift files there are
# tests: `own_test_dirs`); XCTest classes are named `FooTests.swift`.
test_files = ['.*Tests?\.swift$']
own_test_dirs = ["Tests"]
s1_sources = "SWE-rebench V2 (Swift rows its LLM screen rated A: apple/swift-argument-parser, apple/swift-docc, mapbox/mapbox-directions-swift, cpisciotta/xcbeautify, Quick/Nimble, parse-community/Parse-Swift, vapor/jwt-kit gated; apple/swift-markdown, CreateAPI/CreateAPI, apple/swift-distributed-tracing = calibration; SWE-bench Multilingual and Multi-SWE-bench carry no Swift); function gold from the tree-sitter labeler"
s3_gold = "the Swift compiler's index store (swift 6.4.3 in its pinned Docker image, `swift build` with index-while-building; Alamofire 5.12.2, swift-algorithms 1.2.1; Plot 0.14.0 = calibration) and the rueca-bench Swift micro-benchmark"
notes = "Swift callables are functions, methods, protocol requirements, `init`, `deinit`, `subscript` and operators, named `Type.name` (members of `extension T` are `T.name`); property accessors and closures are not callables. The index store resolves calls through protocols, generics and non-final classes to the requirement or base method only; calls of closure values and function references have no gold edge."

# Tree-sitter grammars of the bench labeler (S1 function gold, grep arm, S3
# callables). `binding` = Python package (pinned in pyproject.toml) and
# function returning the language. `labeler = "nesting"` (default) is the
# data-driven labeler (treesitter.py: _nesting_functions); `ecma` is the
# code-backed labeler for JS/TS function shapes.

[grammars.python]
binding = "tree_sitter_python:language"
extensions = [".py", ".pyi"]
callables = { function_definition = "Function" }
containers = ["class_definition"]
separator = "."
wrappers = ["decorated_definition"]

[grammars.typescript]
binding = "tree_sitter_typescript:language_typescript"
extensions = [".ts", ".mts", ".cts"]
labeler = "ecma"

[grammars.tsx]
binding = "tree_sitter_typescript:language_tsx"
extensions = [".tsx"]
labeler = "ecma"

[grammars.javascript]
binding = "tree_sitter_javascript:language"
extensions = [".js", ".jsx", ".mjs", ".cjs"]
labeler = "ecma"

[grammars.php]
binding = "tree_sitter_php:language_php"
package = "tree-sitter-php 0.25.1 (MIT)"
extensions = [".php"]
callables = { function_definition = "Function", method_declaration = "Method" }
containers = ["class_declaration", "interface_declaration", "trait_declaration", "enum_declaration"]
separator = "::"
flat_functions = ["function_definition"]

# Go: code-backed labeler (method names come from the receiver type).
# `calls` / `members` drive SCIP call-site classification (treesitter.py:
# _is_callee): a reference is a call when it is the `calls[parent]` child of
# its parent, or the `members[parent]` child of a callee.
[grammars.go]
binding = "tree_sitter_go:language"
package = "tree-sitter-go 0.25.0 (MIT)"
extensions = [".go"]
labeler = "go"
separator = "."
calls = { call_expression = "function" }
members = { selector_expression = "field", index_expression = "operand", parenthesized_expression = "@0" }

[grammars.java]
binding = "tree_sitter_java:language"
package = "tree-sitter-java 0.23.5 (MIT)"
extensions = [".java"]
callables = { method_declaration = "Method", constructor_declaration = "Method", compact_constructor_declaration = "Method" }
containers = ["class_declaration", "interface_declaration", "enum_declaration", "record_declaration", "annotation_type_declaration"]
separator = "."
calls = { method_invocation = "name", object_creation_expression = "type", explicit_constructor_invocation = "constructor" }
members = { generic_type = "@0", scoped_type_identifier = "@-1" }

# C and C++ share the code-backed `c` labeler; `.h` goes to the grammar whose
# `languages` lists the instance language (C++ when there is no hint).
[grammars.cpp]
binding = "tree_sitter_cpp:language"
package = "tree-sitter-cpp 0.23.4 (MIT)"
languages = ["cpp"]
extensions = [".cc", ".cpp", ".cxx", ".hpp", ".hh", ".hxx", ".h"]
labeler = "c"
separator = "::"
calls = { call_expression = "function", new_expression = "type" }
members = { field_expression = "field", qualified_identifier = "name", template_function = "name", template_method = "name", parenthesized_expression = "@0" }
constructions = true  # `T x(a);` / `T x{a};` / `T x;` in a body: scip-clang's constructor reference on `x` is a call

[grammars.c]
binding = "tree_sitter_c:language"
package = "tree-sitter-c 0.24.2 (MIT)"
languages = ["c"]
extensions = [".c", ".h"]
labeler = "c"
separator = "::"
calls = { call_expression = "function" }
members = { field_expression = "field", parenthesized_expression = "@0" }

# Rust: code-backed labeler for the Rust pack's qualified names (impl self
# type, trait, inline `mod`, enclosing `fn`; treesitter.py: _rust_functions);
# `callables` / `containers` are the node types it reads. A bodiless `fn`
# signature is a callable in a trait only (not in `extern` blocks).
# `macro_rules!` definitions are callables, so an invocation of a macro the
# repository defines is a call edge (std / dependency macros are out of
# scope). `token_calls`: calls written in a macro's arguments
# (`println!("{}", f(x))`), which tree-sitter keeps as a flat token tree and
# rust-analyzer resolves through the expansion (treesitter.py: _is_token_call).
[grammars.rust]
binding = "tree_sitter_rust:language"
package = "tree-sitter-rust 0.24.2 (MIT)"
extensions = [".rs"]
labeler = "rust"
separator = "."
callables = { function_item = "Function", function_signature_item = "Method", macro_definition = "Function" }
containers = ["mod_item", "impl_item", "trait_item"]
calls = { call_expression = "function", macro_invocation = "macro" }
members = { field_expression = "field", scoped_identifier = "name", generic_function = "function" }
token_calls = "token_tree"

# Shell (sh, bash, ksh, bats: tree-sitter-bash; zsh: tree-sitter-zsh, chosen
# per file by the shell pack's dialect rules, shelldialect.py): code-backed
# labeler — every `function_definition` is a callable named by its name
# (shell functions are global, nesting does not qualify them;
# treesitter.py: _shell_functions).
[grammars.bash]
binding = "tree_sitter_bash:language"
zsh_binding = "tree_sitter_zsh:language"
package = "tree-sitter-bash 0.25.1 (MIT), tree-sitter-zsh 0.64.3 (MIT)"
extensions = [".sh", ".bash", ".zsh", ".ksh", ".bats"]
labeler = "shell"
separator = "."

# C#: code-backed labeler (constructors named like their type, operators
# and destructors named like the C# pack's, explicit interface
# implementations `Type.IFace.member`). `local_callables`: scip-dotnet's
# `local N` symbols (local functions) are bound per document;
# `type_constructions`: a type reference on `new T(…)` is a call of `T`'s
# constructors; `generic_overloads`: a call scip-dotnet records with the
# first overload's symbol goes to the generic overload that takes its
# arguments (scip.py).
[grammars.csharp]
binding = "tree_sitter_c_sharp:language"
package = "tree-sitter-c-sharp 0.24.0 (MIT)"
extensions = [".cs"]
labeler = "csharp"
separator = "."
callables = { method_declaration = "Method", constructor_declaration = "Method", destructor_declaration = "Method", operator_declaration = "Method", conversion_operator_declaration = "Method", local_function_statement = "Function" }
containers = ["class_declaration", "struct_declaration", "record_declaration", "interface_declaration"]
calls = { invocation_expression = "function", object_creation_expression = "type" }
members = { member_access_expression = "name", member_binding_expression = "name", conditional_access_expression = "@-1", generic_name = "@0", qualified_name = "name", alias_qualified_name = "name" }
local_callables = true
type_constructions = true
generic_overloads = true

# Kotlin: code-backed labeler (treesitter.py: _kotlin_functions) over
# fwcd/tree-sitter-kotlin at the commit ast-grep released on crates.io as
# tree-sitter-kotlin-sg 0.4.1 (the Rust pack's grammar; pyproject.toml pins
# the git source). A call's callee is the first child of `call_expression`
# (`f()`, `a.f()`, `a?.f()`, `F<T>()`, trailing lambdas) or the type of a
# supertype constructor call (`: Base(x)`); callable references (`::f`) and
# infix calls are not call sites.
[grammars.kotlin]
binding = "tree_sitter_kotlin:language"
package = "tree-sitter-kotlin 0.4.0 (fwcd, MIT; ast-grep/tree-sitter-kotlin@1a6f9b1, = crates.io tree-sitter-kotlin-sg 0.4.1)"
extensions = [".kt", ".kts"]
labeler = "kotlin"
separator = "."
calls = { call_expression = "@0", constructor_invocation = "@0" }
members = { navigation_expression = "@-1", navigation_suffix = "@-1", user_type = "@last:type_identifier" }

# Ruby: code-backed labeler for the Ruby pack's qualified names (constant
# path of the enclosing class / module bodies, `#` instance and `.`
# singleton methods; treesitter.py: _ruby_functions). A SCIP occurrence of a
# method is a call when it is the `method` of a `call` node or a bare
# identifier (Sorbet gives locals `local` symbols), or `super`
# (treesitter.py: _ruby_is_call).
[grammars.ruby]
binding = "tree_sitter_ruby:language"
package = "tree-sitter-ruby 0.23.1 (MIT)"
extensions = [".rb", ".rake", ".gemspec", ".ru"]
labeler = "ruby"
separator = "::"

# SQL: no tree-sitter grammar; the code-backed labeler (sqlgold.py, sqlglot)
# gives the callables — tables, views, routines, triggers, dbt models and
# macros, named queries (`labeler = "sql"`, no `binding`).
[grammars.sql]
package = "sqlglot 30.35.0 (MIT)"
extensions = [".sql", ".psql", ".pgsql", ".plpgsql", ".mysql", ".tsql", ".bq", ".pks", ".pkb", ".pck", ".pls", ".plsql", ".tps", ".tpb"]
labeler = "sql"
separator = "."

# Swift: code-backed labeler (treesitter.py: _swift_functions) over
# alex-pinkus/tree-sitter-swift 0.7.4 (the Swift pack's grammar). A call's
# callee is the first child of `call_expression` (`f()`, `a.f()`, `T()`,
# trailing closures), the type of a `constructor_expression` (`Box<Int>()`),
# or the target of a `.init()` prefix expression. The grammar attaches a
# call to a whole `+` / `*` / prefix-operator expression (`a + b.f(1)`,
# `!x.isEmpty()`): its right-most operand is the callee.
[grammars.swift]
binding = "tree_sitter_swift:language"
package = "tree-sitter-swift 0.7.4 (alex-pinkus, MIT)"
extensions = [".swift"]
labeler = "swift"
separator = "."
calls = { call_expression = "@0", constructor_expression = "constructed_type" }
members = { navigation_expression = "suffix", navigation_suffix = "suffix", prefix_expression = "target", user_type = "@0", additive_expression = "rhs", multiplicative_expression = "rhs", bitwise_operation = "rhs", infix_expression = "rhs", range_expression = "rhs" }

