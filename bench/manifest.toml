# rueca-bench manifest (RFC 0001 §15, RFC 0002 §8).
#
# Only identifiers live here: dataset revisions, instance ids, repository
# commits, tool versions and sha256 pins. Dataset content and repository code
# are fetched at runtime into bench/.cache and never committed.

[bench]
schema = 3
alpha_languages = ["python", "typescript", "javascript"]
# Families pooled in the report's `overall` column of the detailed tables
# (the alpha headline). The scorecard is per language.
overall = ["python", "ecma", "php"]

# ---------------------------------------------------------------- scorecard
# RFC 0004 §6 (floors and targets), §7.2 (minimum populations), §7.6
# (intervals). Values are fractions (latency in milliseconds). Every metric
# has a `floor` (the `stable` bar; `bm25` = the paired bootstrap of
# Rueca − BM25 must not lie entirely below zero, §6.1; absent = reported
# only) and a `target` (`cbm_ratio` = at most that fraction of cbm's value).
# `better = "lower"` for rates and costs. `gated = false` rows are shown in
# the scorecard but never decide a status (confidence-filtered rows, §5).
# The report renders one scorecard per language from this table; nothing
# about floors lives in code.
[scorecard]
min_structural_questions = 300  # per direction and language (§7.2)
min_localization_instances = 30  # per language (§7.2; ≥ 40 where datasets allow)
bootstrap_resamples = 10000
bootstrap_seed = 20261025
min_confidence = 0.6  # second structural row: edges at confidence >= 0.6 (§5)
localization_variant = "kw"  # S1 query variant the scorecard uses (keywords from the issue)

[[scorecard.metrics]]
key = "file_acc@5"
family = "Localization"
label = "File Acc@5"
floor = "bm25"
target = 0.80

[[scorecard.metrics]]
key = "func_acc@10"
family = "Localization"
label = "Function Acc@10"
floor = "bm25"
target = 0.65

[[scorecard.metrics]]
key = "callers_precision"
family = "Structure"
label = "Callers precision"
floor = 0.90
target = 0.97

[[scorecard.metrics]]
key = "callees_precision"
family = "Structure"
label = "Callees precision"
floor = 0.90
target = 0.97

[[scorecard.metrics]]
key = "callers_recall"
family = "Structure"
label = "Callers recall"
floor = 0.75
target = 0.90

[[scorecard.metrics]]
key = "callees_recall"
family = "Structure"
label = "Callees recall"
floor = 0.75
target = 0.90

[[scorecard.metrics]]
key = "callers_precision@conf"
family = "Structure"
label = "Callers precision, confidence ≥ 0.6"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callees_precision@conf"
family = "Structure"
label = "Callees precision, confidence ≥ 0.6"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callers_recall@conf"
family = "Structure"
label = "Callers recall, confidence ≥ 0.6"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "callees_recall@conf"
family = "Structure"
label = "Callees recall, confidence ≥ 0.6"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "callers_precision@strict"
family = "Structure"
label = "Callers precision, strict (no SCIP equivalence classes)"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callers_recall@strict"
family = "Structure"
label = "Callers recall, strict (no SCIP equivalence classes)"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "callees_precision@strict"
family = "Structure"
label = "Callees precision, strict (no SCIP equivalence classes)"
floor = 0.90
target = 0.97
gated = false

[[scorecard.metrics]]
key = "callees_recall@strict"
family = "Structure"
label = "Callees recall, strict (no SCIP equivalence classes)"
floor = 0.75
target = 0.90
gated = false

[[scorecard.metrics]]
key = "definition_found"
family = "Structure"
label = "Definition found"
floor = 0.95
target = 1.0

[[scorecard.metrics]]
key = "micro_callee_f1"
family = "Micro"
label = "Micro-benchmark callee F1"
floor = 0.90
target = 0.98

[[scorecard.metrics]]
key = "parse_error_rate"
family = "Health"
label = "Files with parse errors"
floor = 0.02
target = 0.005
better = "lower"

[[scorecard.metrics]]
key = "parse_error_rate_raw"
family = "Health"
label = "Files with parse errors, raw (vendored and misdetected files included)"
floor = 0.02
target = 0.005
better = "lower"
gated = false

[[scorecard.metrics]]
key = "latency_p95_ms"
family = "Health"
label = "Query latency p95 (ms)"
floor = 100
target = 20
better = "lower"
unit = "ms"

# Efficiency (RFC 0005 §8): tokens per correct answer, measured on what an
# agent reads; Rueca and cbm on the same queries. Reported only.
[[scorecard.metrics]]
key = "search_tokens_to_first_hit"
family = "Efficiency"
label = "Tokens to first gold hit (search_symbols, top 10)"
target = { cbm_ratio = 0.5 }
better = "lower"
unit = "tokens"

[[scorecard.metrics]]
key = "search_tokens_per_hit"
family = "Efficiency"
label = "Tokens per gold hit (search_symbols, top 10)"
target = { cbm_ratio = 0.5 }
better = "lower"
unit = "tokens"

[[scorecard.metrics]]
key = "trace_tokens_per_true_edge"
family = "Efficiency"
label = "Tokens per true edge (trace)"
target = { cbm_ratio = 0.5 }
better = "lower"
unit = "tokens"

# Configuration (RFC 0003 §3.3): one scorecard for the data formats.
[[scorecard.config_metrics]]
key = "key_recall"
label = "Key recall"
floor = 0.95
target = 1.0

[[scorecard.config_metrics]]
key = "span_accuracy"
label = "Span line accuracy"
floor = 0.95
target = 1.0

[[scorecard.config_metrics]]
key = "bridge_precision"
label = "Env bridge precision"
floor = 0.95
target = 0.99

[[scorecard.config_metrics]]
key = "bridge_recall"
label = "Env bridge recall"
floor = 0.75
target = 0.90

# ---------------------------------------------------------------- calibration
# RFC 0004 §7.7: ranking weights and heuristics are tuned only on the
# calibration split — instances and repositories disjoint from the gated
# ones — and the gated set is only evaluated. Entries with
# `split = "calibration"` (`[[s1.repos]]`, `[[s3.repos]]`) are scored in a
# separate section of the report and never enter the scorecard; entries
# with `split = "diagnostic"` are reported and never gated (express, PyCG).

# ---------------------------------------------------------------- health
# Gated parse-error rate (RFC 0004 §5, S5; health.py): besides the built-in
# rules (the vendored directories of Rueca's ranking, `vendor`,
# `node_modules`, GoogleTest / GoogleMock copies, amalgamations), these
# files are left out of the gated rate and counted in the raw one.
# `exclude`: per-repository third-party trees (or copies) without a
# conventional directory name; `not_language`: files with the language's
# extension that are not that language (`glob` and / or `content` regex over
# the first 64 KiB). Every entry says why (bench/README.md, *Health*).
[health]

# MicroPython's `lib/` holds its external dependencies (submodules and
# copies: CMSIS, littlefs, libm, oofatfs, ...; lib/README.md).
[[health.exclude]]
repo = "micropython/micropython"
paths = ["lib"]
reason = "vendored"

# TI CC3200 SDK driverlib and SimpleLink (Texas Instruments copyright),
# FreeRTOS V9.0.0, ST's STM32 USB host library (MCD Application Team).
[[health.exclude]]
repo = "micropython/micropython"
paths = ["ports/cc3200/hal", "ports/cc3200/simplelink", "ports/cc3200/FreeRTOS", "ports/stm32/usbhost"]
reason = "vendored"

# Catch2 2.x keeps Clara (philsquared/Clara) under include/external.
[[health.exclude]]
repo = "catchorg/Catch2"
paths = ["include/external"]
reason = "vendored"

# A frozen copy of the v3.10.5 single header, for the ABI tests.
[[health.exclude]]
repo = "nlohmann/json"
paths = ["tests/abi/include/nlohmann/json_v3_10_5.hpp"]
reason = "amalgamation"

# MicroPython qstr definition lists: `Q(...)` / `QCFG(...)` lines read by
# py/makeqstrdata.py, not C.
[[health.not_language]]
languages = ["c", "cpp"]
glob = "*qstrdefs*.h"
content = '^Q(CFG)?\('
reason = "not the language (qstr list)"

# Objective-C / Objective-C++ in C and C++ repositories (`@interface`,
# `@protocol`, `@implementation`, `#import`).
[[health.not_language]]
languages = ["c", "cpp"]
content = '^\s*(@interface|@implementation|@protocol|#import\s)'
reason = "not the language (Objective-C)"

