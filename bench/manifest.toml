format = "pycg"
repo = "vitsalis/PyCG"
commit = "8d5dc40837803beef1d8d379fbf2cdad6cd94641"
path = "micro-benchmark/snippets"
license = "Apache-2.0"
citation = "Salis et al., PyCG: Practical Call Graph Generation in Python (ICSE 2021)"

# PHP micro-benchmark: Rueca's own hand-labelled snippets (Apache-2.0), in
