# SonarQube analysis settings, read by sonar-scanner (scripts/sonar-gate.sh).
# The server is ephemeral (a fresh SonarQube Community per run), so the
# quality gate applies to the overall code, not to "new code".
sonar.projectKey=rueca
sonar.projectName=Rueca
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=target/**,bench/.cache/**,bench/.venv/**,bench/micro/**,bench/results/**,docs/bench/**,**/tests/fixtures/**,**/testdata/**,**/*.lock,assets/**

sonar.python.version=3.11,3.12,3.13

# No blame needed: every line is "new" on a fresh server, and the checkout
# may be shallow or owned by another uid inside the scanner container.
sonar.scm.disabled=true

# Waivers are `# NOSONAR` comments on the line, each with its reason next
# to it (e.g. bench/src/rueca_bench/scip.py, a seeded PRNG on purpose).

# Clippy runs in CI (ci.yml, `cargo clippy -D warnings`); the scanner image
# has no cargo, so the analyzer's own Clippy pass is off.
sonar.rust.clippy.enabled=false
